name: Example Custom Rules Router
enabled_models:
  - openai/gpt-5.6-sol
  - deepseek-ai/DeepSeek-V4.1-Flash
model_providers:
  openai/gpt-5.6-sol: openai
  deepseek-ai/DeepSeek-V4.1-Flash: fireworks
model_thinking_levels:
  openai/gpt-5.6-sol: [low, medium, high]
  deepseek-ai/DeepSeek-V4.1-Flash: [off]
provider_key_sources:
  openai: managed
  fireworks: managed
routing_strategy: custom
custom_config:
  rules:
    - when: planning, architecture, or difficult debugging
      use: openai/gpt-5.6-sol
      thinking_level: high
    - when: short questions and straightforward implementation
      use: deepseek-ai/DeepSeek-V4.1-Flash
      thinking_level: off
  default: deepseek-ai/DeepSeek-V4.1-Flash
  default_thinking_level: off
