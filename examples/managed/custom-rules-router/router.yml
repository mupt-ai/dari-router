name: Example Custom Rules Router
enabled_models:
  - openai/gpt-5.6-sol
  - fireworks/deepseek-ai/DeepSeek-V4-Flash-0731
model_thinking_levels:
  openai/gpt-5.6-sol: [low, medium, high]
  fireworks/deepseek-ai/DeepSeek-V4-Flash-0731: [off]
provider_key_sources:
  openai: managed
  fireworks: managed
routing_strategy: custom
custom_config:
  rules:
    - when: planning, architecture, or difficult debugging
      use: openai/gpt-5.6-sol
      thinking_level: high
    - when: short questions and straightforward implementation
      use: fireworks/deepseek-ai/DeepSeek-V4-Flash-0731
      thinking_level: off
  default: fireworks/deepseek-ai/DeepSeek-V4-Flash-0731
  default_thinking_level: off
