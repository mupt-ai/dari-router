name: Publish npm package

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Require the mirrored main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "npm releases must be published from the mirrored main branch." >&2
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          registry-url: https://registry.npmjs.org

      - name: Check package version
        id: version
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          echo "version=${PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"
          if npm view "@mupt-ai/dari-router@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "@mupt-ai/dari-router@${PACKAGE_VERSION} is already published; skipping."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: oven-sh/setup-bun@v2
        if: steps.version.outputs.publish == 'true'
        with:
          bun-version: "1.3.13"

      - name: Install npm with trusted publishing support
        if: steps.version.outputs.publish == 'true'
        run: npm install --global npm@11

      - name: Install dependencies
        if: steps.version.outputs.publish == 'true'
        run: bun install --frozen-lockfile

      - name: Validate package
        if: steps.version.outputs.publish == 'true'
        run: bun run typecheck && bun test && bun run test:package

      - name: Publish package
        if: steps.version.outputs.publish == 'true'
        run: npm publish --access public --provenance
