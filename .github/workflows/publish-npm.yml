name: Publish npm package

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Require the mirrored main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "npm releases must be published from the mirrored main branch." >&2
          exit 1

      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          registry-url: https://registry.npmjs.org

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify version is unpublished
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if npm view "@mupt-ai/dari-router@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "@mupt-ai/dari-router@${PACKAGE_VERSION} is already published." >&2
            exit 1
          fi

      - name: Validate package
        run: bun run typecheck && bun test && bun run test:package

      - name: Publish package
        run: npm publish --access public --provenance
